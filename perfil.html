</style>

    <div class="logo-text"><span class="logo-main">SMARTSTAY</span><span class="logo-sub">HOSPITALITY</span></div>
  </a>
  <div class="app-nav-links">
    <a href="portal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span data-i18n="gnav.home">Inicio</span></a>
    <a href="checkin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 11l2 2 4-4"/></svg><span data-i18n="gnav.checkin">Check-in</span></a>

    <a href="servicios.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M4 17c0-4 2-6 2-6h12s2 2 2 6"/></svg><span data-i18n="gnav.services">Servicios</span></a>
    <a href="cuenta.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span data-i18n="gnav.account">Mi cuenta</span></a>

<div class="page-wrap">
  <a href="portal.html" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Volver a mi estadía</a>
  <div class="page-head">
    <div>
      <h1>Mi perfil</h1>
      <p>Actualizá tu información personal.</p>
    </div>
  </div>

  <div class="card card-pad profile-card" style="margin-top:20px;">
    <div class="avatar-row">
      <div class="avatar-lg" id="profileAvatar">H</div>
      <div>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('avatarFileInput').click()">Cambiar foto</button>
        <p style="font-size:12px; margin-top:6px;">JPG o PNG. Máximo 5MB.</p>
      </div>
    </div>
    <form onsubmit="savePerfilForm(event)">
      <div class="room-grid2">
        <div class="form-group"><label class="form-label">Nombre</label><input class="form-input" id="pf-firstname" style="padding-left:14px;" placeholder="Tu nombre"></div>
        <div class="form-group"><label class="form-label">Apellido</label><input class="form-input" id="pf-lastname" style="padding-left:14px;" placeholder="Tu apellido"></div>
      </div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="pf-email" style="padding-left:14px;" type="email" placeholder="tu@correo.com"></div>
      <div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="pf-phone" style="padding-left:14px;" placeholder="+595 985 000 000"></div>
      <div class="room-grid2">
        <div class="form-group"><label class="form-label">Tipo de documento</label>
          <select class="form-input" id="pf-doctype" style="padding-left:14px;"><option>Cédula de identidad</option><option>Pasaporte</option><option>DNI</option></select>
        </div>
        <div class="form-group"><label class="form-label">Número de documento</label><input class="form-input" id="pf-docnumber" style="padding-left:14px;"></div>
      </div>
      <div class="form-group"><label class="form-label">Idioma preferido</label>
        <select class="form-input" style="padding-left:14px;"><option>Español</option><option>English</option><option>Português</option></select>
      </div>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>
  </div>
</div>

<script>
  const perfilGuest = getGuestInfo() || {};
  document.getElementById('pf-firstname').value = perfilGuest.firstName || '';
  document.getElementById('pf-lastname').value = perfilGuest.lastName || '';
  document.getElementById('pf-email').value = perfilGuest.email || '';
  document.getElementById('pf-phone').value = perfilGuest.phone || '';
  document.getElementById('pf-docnumber').value = perfilGuest.documentNumber || '';
  if (perfilGuest.documentType) document.getElementById('pf-doctype').value = perfilGuest.documentType;

  function renderAvatar() {
    const g = getGuestInfo() || {};
    const avatar = document.getElementById('profileAvatar');
    if (g.avatarPhoto) {
      avatar.innerHTML = `<img src="${g.avatarPhoto}" alt="Foto de perfil" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
    } else {
      avatar.textContent = getGuestInitials();
    }
  }
  renderAvatar();

  function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('La imagen supera el límite de 5MB');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      saveGuestInfoAndSync({ avatarPhoto: reader.result });
      renderAvatar();
      showToast('Foto de perfil actualizada');
    };
    reader.readAsDataURL(file);
  }

  function savePerfilForm(e) {
    e.preventDefault();
    saveGuestInfoAndSync({
      firstName: document.getElementById('pf-firstname').value.trim(),
      lastName: document.getElementById('pf-lastname').value.trim(),
      email: document.getElementById('pf-email').value.trim(),
      phone: document.getElementById('pf-phone').value.trim(),
      documentType: document.getElementById('pf-doctype').value,
      documentNumber: document.getElementById('pf-docnumber').value.trim(),
    });
    renderAvatar();
    showToast('Perfil actualizado correctamente');
  }
</script>
</body>
</html>
